<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>McWolf Prison City</title><style>*{box-sizing:border-box}body{margin:0;background:#17191d;color:white;font:16px system-ui}main{max-width:540px;margin:auto;padding:12px}h1{font-size:24px;color:#ffac43;margin:4px 0}canvas{width:100%;background:#292e35;border:2px solid #ba8037}button,input,select{padding:10px;border:0;border-radius:5px;font:inherit;margin:3px;background:#343b44;color:white}button{background:#a65c19}input{max-width:48%}#log{height:110px;overflow:auto;background:#252a30;padding:8px;font-size:13px}small{color:#ccc}#stage{position:relative;aspect-ratio:9/16;background:#17191d;overflow:hidden}#world{width:100%;height:100%;border:0}#hud{position:absolute;top:8%;left:3%;right:3%;background:#151515c9;border-left:4px solid orange;padding:12px;pointer-events:none}#hud b{color:orange}#worldinfo{white-space:pre-line;font-size:14px;margin-top:8px}.live main> :not(#stage):not(#c):not(button){display:none}.live main{padding:0}.live #stage{height:90vh;aspect-ratio:auto}#c{display:none}</style><main><h1>MCWOLF · PRISON CITY</h1><small>Version 0.5 · 3D-Test · simulierte TikTok-Ereignisse</small><div id="stage"><canvas id="world"></canvas><div id="hud"><b>🐺 MCWOLF · PRISON CITY</b><div id="worldinfo"></div></div></div><canvas id="c" width="480" height="430"></canvas><button onclick="document.body.classList.toggle('live')">LIVE-Ansicht an/aus</button><div id="status"></div><a style="color:orange" href="spieler.html">Spielerportal (lokaler Test)</a><div id="camera"></div><div><input id="name" placeholder="TikTok-Name" value="Wolf"><button onclick="follow()">Follow testen</button><input id="amount" type="number" min="1" max="1000000" value="1" aria-label="Anzahl"><button onclick="gift()">Coins testen</button><button onclick="eventXP(1)">Likes testen</button><button onclick="eventXP(50)">Teilen testen</button></div><div><input id="cmd" placeholder="!info / !cam"><button onclick="chat()">Chat senden</button></div><div><button onclick="raid()">Razzia</button><button onclick="spin()">Minispielrad</button><button onclick="home()">Gefängnis</button><button onclick="voice=!voice">Stimme an/aus</button></div><div id="events"></div><div><button onclick="startQuiz()">Quiz testen</button><button onclick="startEscape()">Flucht testen</button><button onclick="blockBattle()">Blockkampf auswerten</button><button onclick="voice=true;say('WOLF ist bereit')">KI-Stimme starten</button></div><div id="controls"></div><div id="log"></div></main><script>
const $=x=>document.getElementById(x),ctx=$('c').getContext('2d');let players=Object.create(null);try{players=Object.assign(Object.create(null),JSON.parse(localStorage.mcwolf||'{}'))}catch{};let mode='home',voice=false,angle=0,game='',round=0,choices={},timer=0,focus='',spinning=false;const games=['Boden ist Lava','Kissenschlacht','Wettrennen','Boden ist Lava','Kissenschlacht','Wettrennen'],colors=['rot','blau','grün','gelb','orange','lila','pink','weiß'],hex=['#e33','#36e','#2b5','#ed3','#f82','#a5e','#f6a','#eee'];const ranks=['Hausfriedensbruch','Sachbeschädigung','Diebstahl','Betrug','Urkundenfälschung','Hehlerei','Einbruchdiebstahl','Körperverletzung','Erpressung','Bestechung','Geldwäsche','Raub','Schwerer Raub','Brandstiftung','Geiselnahme','Bandenraub','Menschenraub','Totschlag','Mord','Mehrfachmord'];const thresholds=[0,5000,15000,50000,100000,250000,500000,1000000,2500000,5000000,10000000,25000000,50000000,75000000,100000000,200000000,350000000,500000000,750000000,1000000000];function rank(x){return thresholds.reduce((r,t,i)=>x>=t?i:r,0)}function award(n,x){let p=players[n];if(!p)return;let old=rank(p.xp);p.xp=Math.min(Number.MAX_SAFE_INTEGER,p.xp+x*mult(p));scores[p.block]+=x;let r=rank(p.xp);if(r>old){enqueue(n,1);say('WOLF: '+n+' erreicht Rang '+(r+1)+' – '+ranks[r]+'. Deine Zelle wird ausgebaut!');}save()}function eventXP(rate){let n=user();if(!players[n])return say('Erst Follow testen');let a=Math.floor(Number($('amount').value));if(!Number.isFinite(a)||a<1||a>1000000)return say('Anzahl 1 bis 1.000.000 eingeben');award(n,a*rate);say(n+' +'+(a*rate).toLocaleString('de-DE')+' XP')}function say(s){$('log').prepend(document.createTextNode(s+'\n'));$('log').style.whiteSpace='pre-line';if(voice&&window.speechSynthesis){let u=new SpeechSynthesisUtterance(s);u.lang='de-DE';speechSynthesis.speak(u)}}function save(){try{localStorage.mcwolf=JSON.stringify(players);saveEvents()}catch{}}function user(){return $('name').value.trim().replace(/^@/,'')}function follow(){let n=user();if(!n)return;if(!players[n]){let count=Object.keys(players).length;if(count>=9000)return say("Gefängnis voll");players[n]={cell:count+1,block:count%3,xp:250,energy:100,money:100,bread:3};scores[count%3]+=250;enqueue(n,0);say('WOLF: Willkommen '+n+'! Zelle '+players[n].cell)}else say('Zelle bereits vorhanden');save()}function gift(){eventXP(100)}function home(){if(mode==='game'||mode==='wheel')nextGame=Date.now()+600000;clearTimeout(timer);mode='home';$('controls').innerHTML='';spinning=false}function raid(){if(!players[user()])return;home();focus=user();say('WOLF: Razzia in Zelle '+players[focus].cell+'!');mode='raid';timer=setTimeout(home,6000)}function spin(){if(spinning||mode==='game')return;home();mode='wheel';spinning=true;let start=performance.now(),i=Math.floor(Math.random()*6),target=360*5-i*60;function tick(t){if(!spinning)return;let f=Math.min(1,(t-start)/3000);angle=target*(1-Math.pow(1-f,3));if(f<1)requestAnimationFrame(tick);else{spinning=false;game=games[i];say('WOLF: '+game+' beginnt!');timer=setTimeout(begin,1000)}}requestAnimationFrame(tick)}function begin(){mode='game';round=0;choices=Object.create(null);Object.keys(players).forEach(n=>choices[n]={pos:0,hp:3,color:-1,duck:0});$('controls').innerHTML='';(game===games[0]?colors:game===games[1]?['!ducken','!werfen']:['!laufen']).forEach(s=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>action(user(),s);$('controls').append(b)});next()}function finish(){let a=Object.keys(choices).filter(n=>choices[n].hp>0).sort((a,b)=>game===games[1]?choices[b].hp-choices[a].hp||choices[b].pos-choices[a].pos:choices[b].pos-choices[a].pos);a.slice(0,3).forEach((n,i)=>{let xp=[3000,1500,500][i];award(n,xp);say('Platz '+(i+1)+': '+n+' +'+xp+' XP')});if(!a.length)say('Keine Gewinner');home()}function next(){if(mode!=='game')return;if(round++>=5){finish();return}timer=setTimeout(()=>{if(game===games[0]){let bad=Math.floor(Math.random()*8);Object.values(choices).forEach(p=>{if(p.color===bad||p.color<0)p.hp=0;else if(p.hp>0)p.pos++;p.color=-1});say('Lava auf '+colors[bad])}next()},10000)}function action(n,s){let p=choices[n];if(mode!=='game'||!p||p.hp<=0)return;if(colors.includes(s)&&game===games[0])p.color=colors.indexOf(s);if(s==='!laufen'&&game===games[2]&&Date.now()-(p.last||0)>700){p.pos++;p.last=Date.now();if(p.pos>=20)finish()}if(game===games[1]){if(s==='!ducken')p.duck=Date.now()+2000;if(s==='!werfen'&&Date.now()-(p.last||0)>1000){p.last=Date.now();let a=Object.keys(choices).filter(k=>k!==n&&choices[k].hp>0);if(a.length){let q=choices[a[Math.floor(Math.random()*a.length)]];if(q.duck<Date.now()){q.hp--;p.pos++}}}}}function chat(){let n=user(),s=$('cmd').value.toLowerCase().trim(),p=players[n];if(!p){say('Erst Follow testen');return}if(!s)return;award(n,5);quizAnswer(n,s);if(s==='!info')say('!cam !brot !flucht !minigame !status');else if(s==='!cam'){enqueue(n,3)}else if(s==='!brot'){if(p.bread>0){p.bread--;p.energy=Math.min(100,p.energy+20)}}else if(s==='!flucht'){joinEscape(n)}else if(s==='!arbeit'){if(Date.now()-(p.lastWork||0)>=30000){p.lastWork=Date.now();earnCoins(p,10);say(n+' hat gearbeitet')}else say('Arbeitspause')}else if(s==='!status')say(n+' Level '+(rank(p.xp)+1)+' '+ranks[rank(p.xp)]+' XP '+p.xp+' Energie '+p.energy);else if(s==='!minigame')say('Nächstes Minispiel automatisch');else {action(n,s);if(s.includes('?'))answerQuestion(s)};save()}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}function text(s,x,y,col='white',size=12){ctx.fillStyle=col;ctx.font=size+'px monospace';ctx.fillText(s,x,y)}function block(x,y,w,h,col){rect(x,y,w,h,col);ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+10,y-8);ctx.lineTo(x+w+10,y-8);ctx.lineTo(x+w,y);ctx.fill();rect(x+w,y,10,h,'#0005')}function person(x,y,n,col='#e87b25'){block(x+5,y,16,16,'#d5aa82');block(x,y+17,26,25,col);rect(x+3,y+42,8,13,'#222');rect(x+15,y+42,8,13,'#222');text(n.slice(0,16),x-8,y-5)}function draw(){rect(0,0,480,430,'#303740');if(mode==='wheel'){ctx.save();ctx.translate(240,210);ctx.rotate(angle*Math.PI/180);games.forEach((g,i)=>{let a=(i*60-120)*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,185,a,a+Math.PI/3);ctx.closePath();ctx.fillStyle=['#c43e20','#265dc0','#239452'][i%3];ctx.fill();ctx.save();ctx.rotate(a+Math.PI/6);text(g,35,4,'white',12);ctx.restore()});ctx.restore();text('▼',230,25,'#ffda64',30)}else if(mode==='game'){text(game+' · Runde '+round,15,25,'#ffb44c',20);if(game===games[0])colors.forEach((s,i)=>{let x=15+i%4*115,y=60+Math.floor(i/4)*160;block(x,y,100,125,hex[i]);text(s,x+8,y+20,'#111')});Object.entries(choices).slice(0,80).forEach(([n,p],i)=>{if(p.hp<=0)return;let x=game===games[0]&&p.color>=0?25+p.color%4*115+(i%3)*20:20+p.pos*18,y=game===games[0]&&p.color>=0?100+Math.floor(p.color/4)*160:90+i%5*60;person(x,y,n)})}else{let p=players[focus];if(p){let r=rank(p.xp);rect(15,35,450,370,'#555b60');for(let y=40;y<400;y+=28)for(let x=20;x<460;x+=48)rect(x+(y%56?0:8),y,44,24,'#666c70');rect(35,85,410,290,'#30363a');block(280,265,120,40,'#aeb6bf');block(280,250,45,18,'#eee');for(let i=0;i<r;i++){let x=50+(i%5)*42,y=120+Math.floor(i/5)*35;block(x,y,25,20,['#a97b45','#8aa4bd','#e9bc46','#58a7a2'][i%4])}person(190+Math.sin(Date.now()/800)*25,235,focus);for(let i=0;i<12;i++)rect(35+i*36,85,7,290,'#aeb5bd');rect(25,35,430,45,blockColors[p.block]);text('BLOCK '+blockNames[p.block]+' | ZELLE '+(Math.floor((p.cell-1)/3)+1),38,62,'white',20);text('RANG '+(r+1)+' · '+ranks[r],38,402,'white',15);$('camera').textContent='Kamera: @'+focus+' · '+cameraReason}else text('Warte auf neue Follower...',65,210);if(mode==='raid'){rect(0,0,480,35,Math.floor(Date.now()/300)%2?'#a22':'#2258a8');text('RAZZIA: '+focus,15,25,'white',20);person(110,75,'WÄRTER','#244d82')}}$('status').textContent=Object.keys(players).length+' Häftlinge · '+(players[user()]?'Rang '+(rank(players[user()].xp)+1)+' · '+ranks[rank(players[user()].xp)]+' · '+players[user()].xp.toLocaleString('de-DE')+' XP · '+blockNames[players[user()].block]+' · Bonus ×'+mult(players[user()])+' · ':'')+(mode==='game'?game:mode==='raid'?'Razzia':'Prison City');requestAnimationFrame(draw)}
const blockNames=['GELB','ROT','BLAU'],blockColors=['#b99a20','#a83b39','#355eaa'];let scores=[0,0,0],winner=-1,blockUntil=0,nextGame=Date.now()+600000,nextQuiz=Date.now()+300000,nextEscape=Date.now()+900000,quiz=null,escape=null;
try{let v=JSON.parse(localStorage.mcwolfEvents||'{}');scores=v.scores||scores;winner=v.winner??-1;blockUntil=v.blockUntil||0}catch{}
Object.values(players).forEach(p=>{p.block=(p.cell-1)%3;p.escapeUntil=p.escapeUntil||0});
function mult(p){return (p.block===winner&&Date.now()<blockUntil?3.5:1)*(Date.now()<(p.escapeUntil||0)?2:1)}
function earnCoins(p,x){p.money+=x*(Date.now()<(p.escapeUntil||0)?2:1);save()}
function blockBattle(){let max=Math.max(...scores);if(!max||scores.filter(x=>x===max).length>1)return say('Blockkampf: noch kein eindeutiger Sieger');winner=scores.indexOf(max);blockUntil=Date.now()+3600000;scores=[0,0,0];say('Block '+blockNames[winner]+' gewinnt! XP mal 3,5 für 60 Minuten');saveEvents()}
function saveEvents(){try{localStorage.mcwolfEvents=JSON.stringify({scores,winner,blockUntil})}catch{}}
function startQuiz(){if(quiz)return;let a=2+Math.floor(Math.random()*48),b=2+Math.floor(Math.random()*48);let pool=[['Wie viel ist '+a+' plus '+b+'?',String(a+b)],['Wie viele Beine hat eine Spinne?','8'],['Wie viele Minuten hat eine Stunde?','60'],['Wie viele Tage hat eine Woche?','7'],['Wie viele Seiten hat ein Dreieck?','3'],['Wie viel ist '+a+' mal '+b+'?',String(a*b)]];let q=pool[Math.floor(Math.random()*pool.length)];quiz={q:q[0],answer:q[1],end:Date.now()+50000,win:[]};nextQuiz=Date.now()+300000;say('Quiz: '+quiz.q)}
function quizAnswer(n,s){if(quiz&&Date.now()<quiz.end&&s===quiz.answer&&quiz.win.length<4&&!quiz.win.includes(n))quiz.win.push(n)}
function endQuiz(){let q=quiz;quiz=null;say('Auflösung: '+q.answer);q.win.forEach((n,i)=>{award(n,[2000,1500,1000,500][i]);say('Quiz Platz '+(i+1)+': '+n)});if(!q.win.length)say('Keine richtige Antwort')}
function startEscape(){if(escape)return;escape={end:Date.now()+50000,join:new Set()};nextEscape=Date.now()+900000;say('Flucht beginnt! 50 Sekunden für !flucht')}
function joinEscape(n){if(!escape||Date.now()>=escape.end)return say('Aktuell keine Flucht');escape.join.add(n);say(n+' versucht zu fliehen')}
function endEscape(){let a=[...escape.join];escape=null;for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}a.slice(0,5).forEach(n=>{players[n].escapeUntil=Date.now()+480000;say(n+' entkommen! 8 Minuten XP und Spielcoins mal 2')});if(!a.length)say('Keine Ausbrecher');save()}
function countdown(t){return Math.max(0,Math.ceil((t-Date.now())/1000))+' s'}
setInterval(()=>{let now=Date.now();if(quiz&&now>=quiz.end)endQuiz();if(escape&&now>=escape.end)endEscape();if(now>=nextGame&&mode==='home')spin();if(now>=nextQuiz&&!quiz)startQuiz();if(now>=nextEscape&&!escape)startEscape();if(winner>=0&&now>=blockUntil){winner=-1;blockBattle()}let p=players[user()];$('events').textContent=blockNames.map((n,i)=>n+': '+Object.values(players).filter(p=>p.block===i).length+'/3000 · '+scores[i]+' Punkte').join(' | ')+'\nMinispiel: '+(mode==='game'||mode==='wheel'?'läuft':countdown(nextGame))+' | Quiz: '+(quiz?quiz.q+' ('+countdown(quiz.end)+')':countdown(nextQuiz))+' | Flucht: '+(escape?'!flucht '+countdown(escape.end):countdown(nextEscape))+(p?' | Spielcoins: '+p.money+' | Bonus ×'+mult(p):'');$('events').style.whiteSpace='pre-line';saveEvents()},1000);

let queue=[],cursor=0,cameraUntil=0,cameraReason='Rundgang';function enqueue(n,priority){queue.push({n,priority});queue.sort((a,b)=>a.priority-b.priority)}function answerQuestion(s){let a=s.includes('xp')?'XP gibt es durch Likes, Chat, Teilen, Geschenke und Siege.':s.includes('flucht')?'Alle 15 Minuten beginnt die Flucht. Fünf Gewinner erhalten acht Minuten doppelten Bonus.':s.includes('zelle')?'Neue Follower erhalten automatisch eine Zelle. Mit jedem Rang wird sie ausgebaut.':s.includes('quiz')?'Alle fünf Minuten gibt es eine Frage mit 50 Sekunden Antwortzeit.':'Diese Frage kann die lokale Spielleitung noch nicht beantworten.';say('WOLF: '+a)}setInterval(()=>{if(mode!=='home')return;let now=Date.now();if(now<cameraUntil&&!(queue[0]?.priority===0&&cameraReason!=='Neuzugang'))return;let q=queue.shift();if(q){focus=q.n;cameraReason=['Neuzugang','Rangaufstieg','Razzia','Kamerawunsch'][q.priority];cameraUntil=now+6000}else{let names=Object.keys(players);if(names.length)focus=names[cursor++%names.length];cameraReason='Rundgang';cameraUntil=now+10000}},200);draw();setInterval(()=>{Object.values(players).forEach(p=>{p.energy=Math.max(0,p.energy-1);if(p.energy<25&&p.bread){p.bread--;p.energy+=30}});save()},30000);
</script><script type="module" src="world.js"></script></html>
