<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>McWolf Spielerportal</title><style>body{background:#121419;color:#eee;font:17px system-ui;max-width:600px;margin:auto;padding:16px}h1{color:#ffad42}section{background:#24272e;padding:18px;border-radius:12px;margin:12px 0}input,button{padding:12px;font:inherit;max-width:60%;border-radius:8px}button{background:#ffad42}progress{width:100%;accent-color:orange}a{color:orange}</style><h1>MCWOLF · PRISON CITY</h1><p>Spielerportal · lokale Testdaten</p><input id="n" placeholder="TikTok-Name"><button onclick="show()">Suchen</button><section id="out">Suche deine Zelle.</section><h2>Rangliste</h2><section id="top"></section><a href="index.html">Zur Spielleitung</a><script>const t=[0,5000,15000,50000,100000,250000,500000,1000000,2500000,5000000,10000000,25000000,50000000,75000000,100000000,200000000,350000000,500000000,750000000,1000000000],r=['Hausfriedensbruch','Sachbeschädigung','Diebstahl','Betrug','Urkundenfälschung','Hehlerei','Einbruchdiebstahl','Körperverletzung','Erpressung','Bestechung','Geldwäsche','Raub','Schwerer Raub','Brandstiftung','Geiselnahme','Bandenraub','Menschenraub','Totschlag','Mord','Mehrfachmord'];function show(){let p={};try{p=JSON.parse(localStorage.mcwolf||'{}')}catch{}let a=Object.entries(p).sort((a,b)=>b[1].xp-a[1].xp),name=document.getElementById('n').value.trim().replace(/^@/,'');let i=a.findIndex(x=>x[0].toLowerCase()===name.toLowerCase()),o=document.getElementById('out');o.replaceChildren();function line(s){let e=document.createElement('p');e.textContent=s;o.append(e)}if(i>=0){let [n,v]=a[i],k=t.reduce((j,x,l)=>v.xp>=x?l:j,0);line('@'+n+' · fiktive Spielakte');line('Block '+['Gelb','Rot','Blau'][v.block]+' · Zelle '+(Math.floor((v.cell-1)/3)+1));line('Rang '+(k+1)+'/20 · '+r[k]);line(v.xp.toLocaleString('de-DE')+' XP · Platz '+(i+1));let bar=document.createElement('progress');bar.max=1;bar.value=k===19?1:(v.xp-t[k])/(t[k+1]-t[k]);o.append(bar);line(k===19?'Maximalrang':Math.floor(bar.value*100)+' % bis zum nächsten Rang');line('Spielcoins: '+v.money)}else line('Keine Zelle gefunden');document.getElementById('top').textContent=a.slice(0,10).map(([n,v],i)=>(i+1)+'. @'+n+' · '+v.xp+' XP').join('\n');document.getElementById('top').style.whiteSpace='pre-line'}show();setInterval(show,2000)</script></html>
